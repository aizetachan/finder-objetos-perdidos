# Publica la web y las reglas de Firestore en producción cuando algo llega a main.
# Nadie despliega a mano.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar en producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Construir la web
        run: pnpm build
        env:
          # Fase 1: producción también funciona con datos de ejemplo. Para pasar a datos
          # reales se cambia la variable VITE_USE_MOCKS del repositorio a "false".
          VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Identificarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Publicar Hosting y reglas de Firestore
        run: |
          npx --yes firebase-tools@15.28.2 deploy --only hosting,firestore \
            --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive

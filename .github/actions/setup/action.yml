name: Preparar proyecto
description: Instala pnpm, Node y las dependencias (pasos comunes a todos los workflows).
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
